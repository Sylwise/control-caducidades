<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/calendar.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión Operativa</title>
</head>

<style>
  /* Critical CSS for instant rendering */
  html,
  body {
    margin: 0;
    padding: 0;
  }

  #initial-loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f8f8f8;
    z-index: 9999;
    transition: opacity 1.5s ease-out;
    /* Match pt-32 (32 * 0.25rem = 8rem). 
       Tailwind pt-32 overrides p-4 for the top side. */
    padding-top: 8rem;
  }

  .loader-logo {
    width: 250px;
    height: 250px;
    margin-bottom: 1rem;
  }
</style>
<div id="initial-loader">
  <img src="/logo.svg" alt="Loading..." class="loader-logo" />
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>

</html>
