name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  # Duplicate test jobs to ensure safety on main branch without branch protection
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    - run: npm ci
    - name: Run Tests
      env:
        MONGODB_URI: "mongodb://localhost:27017/test-db"
        JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret' }}
        PORT: 5000
      run: npm test -- --coverage
    - name: Verify Coverage
      run: npx jest --coverage --coverageThreshold='{"global":{"lines":50}}'

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npx vitest run
    - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [verify-backend, verify-frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
