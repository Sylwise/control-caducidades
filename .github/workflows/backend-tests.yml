name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./server

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      env:
        MONGODB_URI: "mongodb://localhost:27017/test-db" 
        # Note: mongodb-memory-server usually handles the URI automatically in tests if set up correctly
        # using the internal binary, but providing a dummy one if the app expects it for initial validation is safe.
        # However, for 'mongodb-memory-server', we often don't need an external service if the tests instantiate the memory server.
        # But if the user code expects env vars to build the connection string, we might need them.
        JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret' }}
        PORT: 5000
      run: npm test -- --coverage

    # Jest native coverage check is handled in the next step

    - name: Verify Coverage > 50%
      run: npx jest --coverage --coverageThreshold='{"global":{"lines":50}}'
